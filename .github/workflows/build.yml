name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Check Builder Version
        run: npx electron-builder@24.9.1 --version

      - name: Build Project
        run: npm run build

      - name: Build EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder@24.9.1 --win nsis --x64 --publish never

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-ERP-Pro
          path: release/**
